<!DOCTYPE html>
<html>
    <head>
        <title>
            KeyRift
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="page">
            <div id="side">
                <h2>KeyRift</h2>
                <p>Type The Shown Text As Fast As Possible</p>
                <div class="line"></div>
                <h3> Controls</h3>
                <p>N - Normal Mode</p>
                <p>M - Memory Mode</p>
                <p>ESC - End Session</p>
                <div class="line"></div>
                <h3>Best Time</h3>
                <p id="normalBest"> Normal Mode: No Record</p>
                <p id="memoryBest"> Memory Mode: No Record</p>
                <div class="line"></div>
                <p id="sideStatus">Waiting</p>
            </div>
            <div id="game">
                <h1> Reaction Test</h1>
                <p id="info"> Press N Or M To Start</p>
                <div id="mode">Mode: None</div>
                <div id="time">Time: 0.00</div>
                <div id="score">Score: 0</div>
                <div id="sequence"></div>
                <div id="typed"></div>
                <p id="message"></p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
